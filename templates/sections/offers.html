{% load static %}
<section class="product-section product-section--tight">
    <div class="container section-container">
        <div class="product-section-head">
            <div>
                <p class="section-kicker">Bundles</p>
                <h2 class="product-section-title">Plant + pot combos</h2>
            </div>
            <a href="{% url 'store:product_list' %}?combo=1" class="link-view-all">Shop combos</a>
        </div>
        <div class="offer-cards">
            <a href="{% url 'store:product_list' %}?combo=1" class="offer-card offer-card--green">
                <span class="offer-card__tag">Starter kits</span>
                <h3 class="offer-card__title">Plant comes with a matching pot — ready to display</h3>
                <span class="offer-card__cta">Browse bundles <i class="fas fa-arrow-right"></i></span>
            </a>
            <a href="{% url 'store:product_list' %}?sort=price_asc" class="offer-card offer-card--yellow">
                <span class="offer-card__tag">Under budget</span>
                <h3 class="offer-card__title">Great greens at gentler prices — sort low to high</h3>
                <span class="offer-card__cta">View deals <i class="fas fa-arrow-right"></i></span>
            </a>
        </div>
    </div>
</section>
