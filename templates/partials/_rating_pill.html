{% load static %}
{% if product.total_reviews %}
<div class="p99-rating-pill" title="{{ product.average_rating|floatformat:1 }} out of 5 from {{ product.total_reviews }} review{{ product.total_reviews|pluralize }}" aria-label="Rated {{ product.average_rating|floatformat:1 }} out of 5 from {{ product.total_reviews }} review{{ product.total_reviews|pluralize }}">
    <span class="p99-star" aria-hidden="true">★</span>
    <span class="p99-rating-value">{{ product.average_rating|floatformat:1 }}</span>
    <span class="p99-divider" aria-hidden="true"></span>
    <span class="p99-rating-count">{{ product.total_reviews }} review{{ product.total_reviews|pluralize }}</span>
</div>
{% endif %}
